# The studio (studio API + studio UI) for Dokploy, or any Docker host behind
# a reverse proxy. No GPU, Python or upstream checkout: it holds your provider
# keys and creates, watches and terminates GPU servers (aitoolkit-worker),
# which dial back to it at AITK_PUBLIC_URL (docs/studio-api.md).
#
# Dokploy:
#   1. Create > Compose, source: this repo, branch studio, compose path
#      ui-go/docker/compose.studio.yml.
#   2. Environment: set AI_TOOLKIT_AUTH and AITK_PUBLIC_URL (below).
#   3. Domains: service "studio", port 8675, your host (loraboard.com), HTTPS on.
#      Dokploy adds the Traefik labels and network itself.
#   4. Deploy, open https://<host>/studio/ and add the server
#      https://<host> with the AI_TOOLKIT_AUTH token.
#
# The image is private on GHCR unless you make it public: add ghcr.io with a
# read:packages token under Dokploy's registries, or make the package public.

services:
  studio:
    image: ghcr.io/geocine/aitoolkit-studio:${AITK_STUDIO_TAG:-latest}
    restart: unless-stopped
    environment:
      # required: the studio holds your provider keys, so it never runs open
      AI_TOOLKIT_AUTH: ${AI_TOOLKIT_AUTH:?set AI_TOOLKIT_AUTH to a long random token}
      # required: the public https URL GPU servers dial for their tunnel
      AITK_PUBLIC_URL: ${AITK_PUBLIC_URL:?set AITK_PUBLIC_URL, e.g. https://loraboard.com}
      # optional: provider keys used when none is saved in the studio
      AITK_PROVISION_RUNPOD_KEY: ${AITK_PROVISION_RUNPOD_KEY:-}
      AITK_PROVISION_VAST_KEY: ${AITK_PROVISION_VAST_KEY:-}
      AITK_PROVISION_QUICKPOD_KEY: ${AITK_PROVISION_QUICKPOD_KEY:-}
      # optional: origins of a studio hosted elsewhere (comma list)
      AITK_CORS_ORIGINS: ${AITK_CORS_ORIGINS:-}
      # optional: 1 = every provider answers from a mock (try it with no credits)
      AITK_PROVISION_SIMULATE: ${AITK_PROVISION_SIMULATE:-}
      # optional: where GPU servers keep results. One S3-compatible remote:
      # Cloudflare R2 (https://<account>.r2.cloudflarestorage.com) or a
      # Hugging Face storage bucket (https://<namespace>.s3.hf.co, HFAK... keys)
      AITK_S3_NAME: ${AITK_S3_NAME:-}
      AITK_S3_ENDPOINT: ${AITK_S3_ENDPOINT:-}
      AITK_S3_BUCKET: ${AITK_S3_BUCKET:-}
      AITK_S3_ACCESS_KEY_ID: ${AITK_S3_ACCESS_KEY_ID:-}
      AITK_S3_SECRET_ACCESS_KEY: ${AITK_S3_SECRET_ACCESS_KEY:-}
      # more remotes as JSON: [{"name","kind":"s3"|"hf","config":{...},"credentials":{...}}]
      AITK_REMOTES: ${AITK_REMOTES:-}
      # the default remote: every GPU server launched without another choice copies it
      AITK_SYNC_REMOTE: ${AITK_SYNC_REMOTE:-}
      # optional: 1 keeps optimizer.pt after a run completes (to extend it later)
      AITK_SYNC_KEEP_OPTIMIZER: ${AITK_SYNC_KEEP_OPTIMIZER:-}
    # reached through the proxy only; never published on the host
    expose:
      - "8675"
    volumes:
      # provider keys, machines and settings: keep it, and back it up
      - studio-data:/data

volumes:
  studio-data:
