<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio · ai-toolkit</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='6' fill='%235b5bd6'/%3E%3Cpath d='M10 4.5a5.5 5.5 0 1 0 0 11z' fill='%23fff'/%3E%3Ccircle cx='10' cy='10' r='5.5' fill='none' stroke='%23fff' stroke-width='1.5'/%3E%3C/svg%3E"
    />
    <script>
      // apply the saved theme before first paint (see src/lib/theme.ts)
      try {
        var t = JSON.parse(localStorage.getItem('aitk.studio.theme') || 'null');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
